name: Fix curator CRM routing

on:
  push:
    paths:
      - '.github/workflows/fix-curator-crm-routing.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix curator signup endpoint and preserve Dark Orchid
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('internal/curator-server.js')
          s=p.read_text()
          old="/api/portal/curator-signup"
          new="/api/portal/signup"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check internal/curator-server.js
          node --check internal/admin-server.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/curator-server.js
          git diff --cached --quiet || git commit -m 'Fix curator CRM signup routing'
          git push
