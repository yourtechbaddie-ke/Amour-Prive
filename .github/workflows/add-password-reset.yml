name: Add password reset flow
on:
  workflow_dispatch:

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Implement reset pages and portal routes
        env:
          PY: ${{ github.workspace }}/.tmp_password_reset.py
        run: |
          cat > "$PY" <<'PY'
          from pathlib import Path
          
          def replace_once(path, old, new):
              p=Path(path); s=p.read_text();
              if old not in s: raise SystemExit(f'pattern not found in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))
          
          reset='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amour Privé · Reset Password</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Allura&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet"><style>:root{--b:#4b101e;--r:#a86c78;--i:#f7f1e9;--e:#261a19;--m:#766a67}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 8%,#a86c7820,transparent 30%),linear-gradient(135deg,#f7f1e9,#fffaf5 55%,#f1e1e2);color:var(--e);font:14px Manrope,system-ui;display:grid;place-items:center}.box{width:min(500px,92vw);padding:44px;background:#fffaf5eb;border:1px solid #4b101e25;box-shadow:0 30px 90px #4b101e18}.logo{font:36px Allura,cursive;color:var(--b)}.ey{font:8px 'DM Mono';letter-spacing:.18em;text-transform:uppercase;color:var(--b);margin-top:8px}.box h1{font:400 44px/1 'Playfair Display',serif;margin:18px 0}.box p{color:var(--m);line-height:1.7}.field{margin:22px 0}.field label{display:block;font:8px 'DM Mono';letter-spacing:.16em;text-transform:uppercase;color:var(--b);margin-bottom:9px}.field input{width:100%;background:transparent;border:0;border-bottom:1px solid #4b101e35;padding:14px 2px;outline:0}.btn{border:1px solid var(--b);background:var(--b);color:#fff;padding:14px 20px;font:9px 'DM Mono';letter-spacing:.13em;text-transform:uppercase;cursor:pointer}.msg{min-height:28px;color:var(--b);line-height:1.6}.back{display:inline-block;margin-top:20px;color:var(--b);font:8px 'DM Mono';letter-spacing:.12em;text-transform:uppercase;text-decoration:none}</style></head><body><main class="box"><div class="logo">Amour Privé</div><div class="ey">Private access</div><h1>Reset your <i>password.</i></h1><p id="copy">Enter the email address associated with your account and we'll send you a secure password reset link.</p><form id="form"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" required></div><div id="newFields" style="display:none"><div class="field"><label>New password</label><input id="password" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8"></div></div><div class="msg" id="msg"></div><button class="btn" id="submit">Send reset link ↗</button></form><a class="back" href="/">← Return to sign in</a></main><script>const q=new URLSearchParams(location.search),token=q.get('token')||'',role=q.get('role')||'curator';const form=document.getElementById('form'),email=document.getElementById('email'),newFields=document.getElementById('newFields'),password=document.getElementById('password'),confirm=document.getElementById('confirm'),msg=document.getElementById('msg'),submit=document.getElementById('submit'),copy=document.getElementById('copy');if(token){email.style.display='none';email.required=false;newFields.style.display='block';copy.textContent='Choose a new password for your account, then return to the sign-in page.';submit.textContent='Set new password ↗'}form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';submit.disabled=true;try{const body=token?{token,password:password.value,confirmPassword:confirm.value}:{email:email.value.trim(),role};const r=await fetch('/api/'+(token?'reset-password':'forgot-password'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to continue.');msg.textContent=d.message||'Done.';if(!token){form.style.display='none';copy.textContent='Check your inbox for the reset link, then follow it to choose a new password.'}else{submit.textContent='Return to sign in';submit.onclick=()=>location.href='/';}}catch(err){msg.textContent=err.message;submit.disabled=false}});</script></body></html>'''
          for d in ['internal/admin','internal/curator']:
              Path(d,'forgot-password.html').write_text(reset)
          
          # Add a forgot-password link to both existing login forms.
          for f in ['internal/admin/index.html','internal/curator/index.html']:
              p=Path(f); s=p.read_text()
              marker='<div id="confirmField"'
              if marker in s:
                  s=s.replace(marker,'<div id="forgotLink" style="text-align:right;margin:-8px 0 18px"><a href="/forgot-password.html" style="color:#4b101e;font:8px DM Mono;letter-spacing:.1em;text-transform:uppercase;text-decoration:none">Forgot password?</a></div>'+marker,1)
              else:
                  s=s.replace('<div class="error" id="err">','<div id="forgotLink" style="text-align:right;margin:-8px 0 18px"><a href="/forgot-password.html" style="color:#4b101e;font:8px DM Mono;letter-spacing:.1em;text-transform:uppercase;text-decoration:none">Forgot password?</a></div><div class="error" id="err">',1)
              p.write_text(s)
          
          # Proxy reset calls through the portal servers to the CRM.
          for f in ['internal/admin-server.js','internal/curator-server.js']:
              p=Path(f); s=p.read_text()
              marker="app.post('/api/logout'"
              insert="app.post('/api/forgot-password',async(q,r)=>{const x=await crm('/api/portal/forgot-password',{method:'POST',body:JSON.stringify(q.body||{})});r.status(x.status).json(x.data)});app.post('/api/reset-password',async(q,r)=>{const x=await crm('/api/portal/reset-password',{method:'POST',body:JSON.stringify(q.body||{})});r.status(x.status).json(x.data)});"
              if marker not in s: raise SystemExit(f'route marker missing: {f}')
              s=s.replace(marker,insert+marker,1)
              p.write_text(s)
          PY
          python "$PY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/admin internal/curator internal/admin-server.js internal/curator-server.js
          git commit -m "Add forgot password flow to CEO and curator portals" || exit 0
          git push
