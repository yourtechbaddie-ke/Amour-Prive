name: Remove portal security implementation copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove implementation details from portal copy
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = [
              'Passwords are securely hashed in the operational database and are never stored in the frontend or GitHub.',
              'Your account details are stored securely in the Amour Privé operational database. Passwords are never stored in plain text.',
          ]
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              new = text
              for phrase in replacements:
                  new = new.replace(phrase, '')
              if new != text:
                  p.write_text(new, encoding='utf-8')
          PY
          rm -f .github/workflows/remove-portal-security-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove security implementation details from portals'
          git push
