<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amour Privé · CEO Office</title><style>body{margin:0;background:#07090a;color:#e9e1d5;font:14px Arial}header{padding:25px 6%;border-bottom:1px solid #b7955b44}main{padding:50px 6%;max-width:1300px;margin:auto}h1{font-size:60px;font-weight:400}.gold{color:#d5bd8b}.login,.grid,.panel{display:grid;gap:15px}.login{max-width:400px}.grid{grid-template-columns:repeat(4,1fr)}.panel{background:#0d1213;border:1px solid #b7955b33;padding:22px;margin-top:25px}.stat{font-size:32px;color:#d5bd8b}input,button{padding:13px;background:#090d0e;border:1px solid #b7955b55;color:#e9e1d5}button{cursor:pointer;background:#681d2b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tab{padding:10px;border:1px solid #b7955b33;cursor:pointer}.rows{display:grid;gap:8px}.row{padding:14px;border-bottom:1px solid #b7955b22}.hide{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}h1{font-size:44px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header>AMOUR PRIVÉ · <span class="gold">CEO PRIVATE OFFICE</span></header><main><div id="login"><h1>Good evening,<br><span class="gold">CEO.</span></h1><div class="login"><input id="e" type="email" placeholder="CEO email"><input id="p" type="password" placeholder="Password"><button onclick="login()">Enter private office ↗</button><small id="err"></small></div></div><div id="app" class="hide"><h1>Command<br><span class="gold">the house.</span></h1><div class="grid"><div class="panel"><span>Leads</span><b id="l" class="stat">—</b></div><div class="panel"><span>Bookings</span><b id="b" class="stat">—</b></div><div class="panel"><span>Inquiries</span><b id="i" class="stat">—</b></div><div class="panel"><span>Training</span><b id="t" class="stat">—</b></div></div><div class="tabs"><span class="tab" onclick="show('leads')">CRM</span><span class="tab" onclick="show('bookings')">Bookings</span><span class="tab" onclick="show('inquiries')">Live inquiries</span><span class="tab" onclick="show('curators')">Curators</span><span class="tab" onclick="show('training')">Training</span><span class="tab" onclick="show('credentials')">Credentials / commissions</span></div><div class="panel"><h2 id="title">Live data</h2><div id="rows" class="rows"></div></div></div></main><script>let token='';async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})});if(!r.ok){err.textContent='Access denied';return}token=(await r.json()).token;login.classList.add('hide');app.classList.remove('hide');load()}async function api(path){const r=await fetch('/api/'+path,{headers:{Authorization:'Bearer '+token}});return r.json()}async function load(){const x=await api('overview');l.textContent=x.totalLeads;b.textContent=x.totalBookings;i.textContent=x.totalInquiries;t.textContent=x.totalTrainingResources;show('leads')}async function show(type){title.textContent=type==='leads'?'CRM · Leads':type==='bookings'?'All bookings':type==='inquiries'?'Live inquiries':type==='curators'?'Curator network':type==='training'?'Training resources':'Credentials & commissions';const map={leads:'leads',bookings:'bookings',inquiries:'inquiries',curators:'curators',training:'training',credentials:'credentials'};const data=await api(map[type]);rows.innerHTML=(data||[]).map(x=>'<div class="row"><b>'+esc(x.full_name||x.client_name||x.display_name||x.title||'Record')+'</b><br><small>'+esc(x.email||x.destination||x.partner||x.issuer||x.status||'')+'</small></div>').join('')||'<div>No records yet.</div>'}function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</script></body></html>
