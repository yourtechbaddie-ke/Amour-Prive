<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amour Privé · Curator Desk</title><style>body{margin:0;background:#07090a;color:#e9e1d5;font:14px Arial}header{padding:22px 6%;border-bottom:1px solid #b7955b33}.gold{color:#d5bd8b}main{padding:45px 6%;max-width:1200px;margin:auto}h1{font-size:56px;font-weight:400}.login{max-width:420px;display:grid;gap:12px}input,button{padding:13px;background:#090d0e;border:1px solid #b7955b55;color:#e9e1d5}button{background:#681d2b;cursor:pointer}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.nav button{background:transparent}.panel{background:#0d1213;border:1px solid #b7955b33;padding:22px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{font-size:30px;color:#d5bd8b;display:block}.hide{display:none}.row{padding:13px 0;border-bottom:1px solid #b7955b22}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:43px}}</style></head><body><header>AMOUR PRIVÉ · <span class="gold">INDEPENDENT TRAVEL CURATOR</span></header><main><div id="login"><h1>Your private<br><span class="gold">desk.</span></h1><div class="login"><input id="e" type="email" placeholder="Curator email"><input id="p" type="password" placeholder="Password"><button onclick="login()">Enter curator desk ↗</button><small id="err"></small></div></div><div id="app" class="hide"><h1>Curate the world<br><span class="gold">beautifully.</span></h1><div class="grid"><div class="panel"><span>Bookings</span><b id="b" class="stat">—</b></div><div class="panel"><span>Live inquiries</span><b id="i" class="stat">—</b></div><div class="panel"><span>Credentials</span><b id="c" class="stat">—</b></div></div><div class="nav"><button onclick="show('bookings')">Bookings</button><button onclick="show('inquiries')">Live inquiries</button><button onclick="show('resources')">Partner training</button><button onclick="show('compare')">Booking comparison</button><button onclick="show('credentials')">Certifications · Awards · Commission</button><button onclick="show('ai')">Team GPT</button></div><div id="content" class="panel">Choose a private-desk module.</div></div></main><script>let token='';async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})});if(!r.ok){err.textContent='Access denied';return}token=(await r.json()).token;document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');load()}async function api(p){const r=await fetch('/api/'+p,{headers:{Authorization:'Bearer '+token}});return r.json()}async function load(){const d=await api('data');b.textContent=d.bookings.length;i.textContent=d.inquiries.length;c.textContent=d.credentials.length}async function show(x){if(x==='compare'){content.innerHTML='<h2>Comparison Desk</h2><p>Use public market references for comparison only; they are not Amour Privé inventory.</p><p><a href="https://www.booking.com/" target="_blank" style="color:#d5bd8b">Booking.com ↗</a></p>';return}if(x==='ai'){content.innerHTML='<h2>Team GPT</h2><p>One-click AI itinerary and content generation is available in the full AI-enabled curator workspace. Review every output before client delivery.</p>';return}const d=await api(x==='resources'?'resources':x);content.innerHTML=(d||[]).map(a=>'<div class="row"><b>'+esc(a.title||a.client_name)+'</b><br><small>'+esc(a.destination||a.description||a.issuer||a.status||a.partner||'')+'</small></div>').join('')||'No records yet.'}function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</script></body></html>
